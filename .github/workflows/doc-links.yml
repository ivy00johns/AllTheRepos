# Doc links — resolve every link in the Markdown, on a change and on a schedule.
#
# Its own workflow rather than a job in ci.yml, for two reasons.
#
# It is the only gate that needs the network, so it should not be able to colour
# the typecheck and unit signal that it has nothing to do with. And it is the
# only gate that has to run when *nothing here changed*: a page upstream can rot,
# and a published release can be deleted, without a single commit. ci.yml is
# push-and-PR only, so putting a schedule there would run the whole Electron
# suite once a week to find out whether a link still resolves.
#
# What it catches, on this repository's own history: `CHANGELOG.md` pointing at
# a release that had been deleted, `contracts/actions.v1.md` citing an Electron
# page upstream had moved, and two archived plans pointing at documents that had
# been moved out from under them.
#
# `scripts/check-doc-links.mjs` resolves both kinds of link — out to the web
# (404 fails; a rate limit, a bot wall or a timeout is reported and does not,
# because a check that cannot run is not a verdict) and in to this repository's
# own files (a target that is not there, or that climbs out of the repository,
# is dead).
name: Doc links

on:
  push:
    paths:
      - "**.md"
      - "scripts/check-doc-links.mjs"
      - "scripts/release-config.mjs"
      - "package.json"
      - ".github/workflows/doc-links.yml"
  pull_request:
    paths:
      - "**.md"
      - "scripts/check-doc-links.mjs"
      - "scripts/release-config.mjs"
      - "package.json"
      - ".github/workflows/doc-links.yml"
  schedule:
    # Mondays, 13:00 UTC — upstream rot and a deleted release are exactly the
    # failures a push trigger cannot see, which is why this exists at all. A
    # failing scheduled run notifies whoever last touched this file.
    - cron: "0 13 * * 1"
  # Run it by hand after a rebuild of a feed, or to re-check a host that was
  # down on the last run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: external + relative
    runs-on: macos-14
    permissions:
      contents: read
      # The README links to this repo's own workflows, and the source repo is
      # private, so only a token reads those. Without it they report as
      # unverified instead of resolved — honest, but not a check.
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned `packageManager` field (pnpm 9.15.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No `pnpm install`: the checker has no dependencies, and `pnpm links:check`
      # only needs Node.
      - name: Resolve every link in the Markdown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm links:check
