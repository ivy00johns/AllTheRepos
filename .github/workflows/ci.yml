# CI — the gates, on every push and pull request (ATR-047).
#
# macOS only, and on both architectures a Mac comes in. The app ships as an
# arm64 bundle (`electron-builder --mac`, `identity: "-"`) and its native
# modules (better-sqlite3, find-git-repositories) are rebuilt per architecture,
# so a Linux runner would be testing a build nobody ships — and the Electron
# suite launches a real window, which the specs assume is possible. So: one
# Apple silicon machine and one Intel one. See the `e2e` job for why the second
# exists when nothing is published for it.
#
# The steps are the same commands a developer runs, in the same order, so any
# red run reproduces locally without translation:
#   pnpm typecheck · pnpm lint · pnpm first-launch:check · pnpm badges · pnpm test:electron-e2e
# and, for a job that has to package the app before it can run at all:
#   pnpm electron:pack · pnpm test:packaged-update-refused
#
# `pnpm badges` is `pnpm test` plus a JSON report, and the badge the README
# shows is drawn from that same run — which is what stops the test count being
# a number somebody has to remember to update.
#
# The link check is NOT here: it needs the network and a schedule, so it lives
# in `.github/workflows/doc-links.yml`.
#
# The lint step is ATR-054's flat config (`eslint.config.mjs`), which landed
# after the rest of this file did, and runs on the fast job: no build, no network,
# no native rebuild — the same command a developer runs.
name: CI

on:
  push:
  pull_request:
  # A dispatch runs every job in this file, the drill at the bottom included.
  # That is the point rather than an oversight: the drill's subject is the gate
  # the other jobs are running, and `gh workflow run ci.yml` is how a person
  # proves on a runner that the refusal check can still fail without waiting for
  # a push to do it for them.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and the unit suite are host-ABI work: one install, no native
  # rebuild, and the fast signal — so they share a job and gate the slow one.
  check:
    name: typecheck + unit
    runs-on: macos-14
    # `contents: write` is for one step: the badge refresh below commits the SVG
    # when the counts moved. The rest of the job only reads. Worth knowing: a
    # push made with the default `GITHUB_TOKEN` does not start a new workflow
    # run, so the refresh cannot set this job off in a loop.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned `packageManager` field (pnpm 9.15.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # TypeScript says the program is coherent; this says the parts of it that
      # compile anyway are the parts somebody meant to write — an import nothing
      # uses, a `require` reached for out of habit, a type that accepts `0` where
      # the comment says "empty". See `eslint.config.mjs` for what it is not
      # (type-aware, stylistic) and why.
      #
      # A suppression that suppresses nothing is an error here as well, which is
      # what stops a disable comment from outliving the rule it was written for:
      # 27 of them did, naming rules that left with the Next-era linter, and
      # nothing noticed until they were read by hand.
      - run: pnpm lint
      # The first-launch instructions are rendered from one source
      # (`scripts/first-launch.mjs`) into the file inside the DMG, the release-note
      # paragraph and the CI warning. This fails if that file has drifted from what
      # renders it, and if any text a person can read still sends them through the
      # right-click override macOS 15 removed — which is the advice all three
      # surfaces carried, and the reason they are rendered from one place now.
      # Pure Node, no network, so it belongs in the fast job.
      - name: The first-launch instructions, and the advice they must not give
        run: pnpm first-launch:check
      # The front door must not name a release version. `README.md` said "The
      # current release is `v0.1.6`" for two releases after that stopped being
      # true, and the link check cannot see it: `.../alltherepos-releases/releases`
      # resolved the whole time, next to prose naming a superseded version. The
      # number belongs to the feed and the badge, which are read from it, and the
      # README links `.../releases/latest`, which redirects. Pure Node, no network.
      - name: The front door, and the versions it must not name
        run: pnpm versions:check
      # Every architecture in `electron-builder.yml` has to have a binary for
      # every native module inside the bundle, and "macOS on Apple silicon" is a
      # fact about that file while the reasons for it live in the dependency
      # tree — `@lancedb/lancedb` ships prebuilt binaries with no darwin-x64
      # among them, while `better-sqlite3` and `find-git-repositories` compile
      # from source and cover anything. Adding `x64` to the dmg/zip targets
      # packages fine and then loses semantic search on an Intel Mac, because
      # `services/lance.ts` fails soft on purpose — so no gate would go red and
      # this is the gate that has to. It also prints which platforms *would*
      # build, which is the answer to "can we expand?". Pure Node, no network.
      - name: The architectures, and the binaries each one needs
        run: pnpm platforms:check
      # The unit suite writes its own totals to a JSON report and the badge is
      # drawn from them, so the number in the README is always the number this
      # run just produced. It went stale by hand three times before this.
      - name: Unit suite, and the totals the badge is drawn from
        run: pnpm badges
      # Committed rather than checked, so the badge cannot be left stale by
      # forgetting to run anything. Only on main: a pull request's branch is not
      # what the README describes, and a fork cannot write anyway.
      - name: Commit the badge when the counts moved
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/images/tests.svg; then
            echo "the badge already matches this run"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/tests.svg
          git commit -m "chore: refresh the test-count badge [skip ci]" \
            -m "Drawn from the unit suite that just ran, so it cannot drift from it."
          git push origin HEAD:main

  # Separate job on purpose: this one flips the native ABI to Electron's and
  # builds the bundle, which is exactly the state the check job must not be in
  # while it runs. It also fails for reasons the unit suite never sees.
  #
  # Two legs, one per architecture a Mac comes in. Only one of them is a build
  # anybody can download — `electron-builder.yml` ships arm64 and nothing else —
  # so the Intel leg tests no product. It answers a different question: **does
  # this app run on x86_64 at all?** Measured on its first run: yes, and every
  # test answered the same way on both machines. It is also the precondition for
  # the decision still open upstream of it — adding `x64` to the dmg/zip targets
  # is a one-line change that packages and uploads an Intel build, and whether
  # that build is worth shipping is what this leg is for.
  #
  # The loss that comes with it is unglamorous and easy to miss: no darwin-x64
  # binary means no vector store, `services/lance.ts` fails soft on purpose, and
  # semantic search quietly degrades to FTS. Two gates cover that pair.
  # `pnpm platforms:check` asserts the missing binary from package metadata, on
  # the fast job. `tests/e2e/vector-store.spec.ts` measures it here — it asks the
  # app's own runtime whether the binding loads, and then drives a real search
  # with an embedding provider arranged on the runner, which is what puts
  # `lance.ts`'s own `catch` under test rather than one of the two around it.
  # Delete that catch and this leg goes red, the only place in this repository
  # that would notice. `tests/e2e/semantic-search.spec.ts` is the other side of
  # the same seam: it scans the seeded repos with a provider on the runner and
  # asserts a search comes back with a vector contribution, which is the only
  # test where a stored embedding and a query meet.
  #
  # `macos-13` was the Intel label this leg was first asked for, and it no longer
  # exists: GitHub retired the macOS 13 images on 2025-12-04 (the last x86_64
  # image was replaced by `macos-15-intel`, itself scheduled for Fall 2027).
  #
  # `fail-fast: false`, because the two legs fail for unrelated reasons and an
  # Intel-only break that cancelled the arm64 run would take the one result
  # anybody can act on down with it.
  #
  # The suite no longer depends on a scanned library: global setup seeds a
  # small synthetic catalog into a throwaway profile that every launch copies
  # (tests/e2e/_global-setup.ts), so specs exercise their populated branches
  # on a fresh runner too. Host-dependent legs (process detection) wait on
  # real `lsof` polling and are asserted, not tolerated.
  e2e:
    name: electron e2e (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The leg's whole premise is which architecture it is, and a label is not
      # evidence: `macos-14` and `macos-15-intel` differ by one word, and a
      # second leg that quietly ran on arm64 again would look exactly like one
      # that works. So ask the machine, and ask the Electron binary the suite is
      # about to launch — before it launches anything.
      - name: Prove this leg is the architecture it is named for
        run: |
          set -euo pipefail
          echo "runner: $(uname -m) on macOS $(sw_vers -productVersion)"
          echo "node: $(node -p 'process.arch')"

          if [ "$(uname -m)" != "${{ matrix.machine }}" ]; then
            echo "::error::this leg is ${{ matrix.arch }}, but the runner is $(uname -m)"
            exit 1
          fi

          ELECTRON="$(node -p 'require("electron")')"
          file "$ELECTRON"
          case "$(file -b "$ELECTRON")" in
            *"${{ matrix.machine }}"*) ;;
            *) echo "::error::the ${{ matrix.arch }} leg would launch $ELECTRON, which is not ${{ matrix.machine }}"; exit 1 ;;
          esac
      - run: pnpm test:electron-e2e
      # One name per leg. `upload-artifact@v4` refuses a second upload under a
      # name already used in the same run, so a shared name would turn two
      # failing legs into one failing leg and one error about the artifact.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore

  # The packaged update check, run against a GitHub that refuses to answer.
  #
  # When GitHub declines an anonymous read — 403, an allowance spent by somebody
  # else sharing the runner's address — the spec stops with a reason instead of
  # failing, because that status says nothing about the release. Right bargain,
  # one hole: **a skip is not a pass**, and the branch that skips is the branch
  # nothing exercises. The guard could stop guarding entirely and this pipeline
  # would look the same — green, with less and less behind the number.
  #
  # So the refusal is arranged instead of awaited. `scripts/refuse-github.cjs` is
  # required into the Playwright worker and answers every GitHub read with
  # GitHub's own 403, and `scripts/refused-update-check.mjs` fails this job unless
  # the tests that read the feed stopped *for that reason*, said so with a
  # `::warning::`, and nothing else in the suite failed. A run that skips for some
  # other reason, or that never reaches the mock at all, is a failure here —
  # which is the whole difference between covering a skip path and appearing to.
  #
  # Its own job rather than a step in `e2e`, for two reasons: it packages the app
  # rather than only building it, and it is the one job whose apparatus has to lie
  # about the network — a failure in it should not be read as one in the suite
  # next door. The two run in parallel, so what this costs is a runner, not time
  # on the clock.
  refusal:
    name: packaged update check, refused
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The spec launches real bundled apps, so there have to be two of them: the
      # current build, for the branch that asks whether the app is up to date,
      # and `electron:pack-older`'s — the same app stamped `0.0.1`, genuinely
      # below every release — for the branch that asks whether an update is
      # offered. A missing bundle is not a smaller run: the check below fails
      # unless every test that reads the feed stopped for the refusal, so skipping
      # either build fails the job rather than quietly reducing it.
      - run: pnpm electron:pack
      - run: pnpm electron:pack-older
      - name: The update check, against a GitHub that refuses to answer
        run: pnpm test:packaged-update-refused

  # The job above can stop noticing anything — the mock loaded, it refused
  # nothing, every test went green for its ordinary reasons, and the only thing
  # that changed is how much the gate is worth. Nothing about a passing run says
  # otherwise.
  #
  # So this proves the other half: the same command, the same spec, with the mock
  # deliberately thrown (`ATR_REFUSE_GITHUB=off`), and
  # `scripts/drill-refused-update-check.mjs` asserting the check comes back
  # *failed*, naming the refusal. A check that passed, or that failed because a
  # bundle was missing, is a failed drill.
  #
  # On demand only. It rebuilds the two bundles rather than reusing the job
  # above's, because a job gets a fresh runner: the alternative is uploading two
  # hundred megabytes of .app between jobs to save a minute of a run a person
  # asked for by hand.
  drill:
    name: prove the refusal check can fail
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The drilled command is the real one, so it needs what the real one needs.
      - run: pnpm electron:pack
      - run: pnpm electron:pack-older
      - name: The refusal check, against a mock that refuses nothing
        run: node scripts/drill-refused-update-check.mjs
