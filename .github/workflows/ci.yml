# CI — the three gates, on every push and pull request (ATR-047).
#
# macOS on Apple silicon only. The app is macOS-only (`electron-builder
# --mac`, `identity: "-"`, an arm64 bundle) and its native modules
# (better-sqlite3, find-git-repositories) are rebuilt per architecture, so a
# Linux runner would be testing a build nobody ships — and the Electron suite
# launches a real window, which the specs assume is possible.
#
# The steps are the same commands a developer runs, in the same order, so any
# red run reproduces locally without translation:
#   pnpm typecheck · pnpm test · pnpm test:electron-e2e · pnpm links:check
#
# A lint step belongs here once ATR-054 adds a config; there is no linter in
# the repo today, so the workflow does not pretend to run one.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and the unit suite are host-ABI work: one install, no native
  # rebuild, and the fast signal — so they share a job and gate the slow one.
  check:
    name: typecheck + unit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned `packageManager` field (pnpm 9.15.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Separate job on purpose: this one flips the native ABI to Electron's and
  # builds the bundle, which is exactly the state the check job must not be in
  # while it runs. It also fails for reasons the unit suite never sees.
  #
  # The suite no longer depends on a scanned library: global setup seeds a
  # small synthetic catalog into a throwaway profile that every launch copies
  # (tests/e2e/_global-setup.ts), so specs exercise their populated branches
  # on a fresh runner too. Host-dependent legs (process detection) wait on
  # real `lsof` polling and are asserted, not tolerated.
  e2e:
    name: electron e2e
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:electron-e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  # The only gate that talks to the internet, and its own job for that reason:
  # a link that rotted should say "a link rotted", not colour the typecheck and
  # unit signal it has nothing to do with — and being separate, one flaky host
  # cannot take the suite that matters down with it.
  #
  # It resolves every external link in the tracked Markdown (`scripts/
  # check-doc-links.mjs`), which is what catches a changelog entry pointing at a
  # deleted release or a contract citing a page upstream has moved. A 404 fails
  # the job; a rate limit, a bot wall or a timeout does not, because a check
  # that could not run is not a verdict. No `pnpm install` — the script has no
  # dependencies and `pnpm links:check` only needs Node.
  #
  # `actions: read` is for the README badges, which link to this repo's own
  # workflows: the source repo is private, so only a token reads them, and
  # without it those links report as unverified instead of resolved.
  links:
    name: doc links
    runs-on: macos-14
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve every external link in the Markdown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm links:check
