# CI — the gates, on every push and pull request (ATR-047).
#
# Two runners, because two different things are being asked. The jobs that
# **launch the app** need a Mac: it ships as an arm64 bundle (`electron-builder
# --mac`, `identity: "-"`), so a Linux runner would be testing a build nobody
# ships, and the Electron suite drives a real window, which the specs assume is
# possible. So `e2e` runs the suite on `macos-14` — the one architecture the app
# ships, and the only leg left now that the Intel one is retired — and `refusal`
# packages the app on the same machine. The **fast job needs none of
# that**: `typecheck`, `lint`, the prose gate, the document and architecture
# checks and the unit suite are host-Node work, and all three native modules the
# suite loads have a Linux answer — `better-sqlite3` and
# `find-git-repositories` compile from source, and `sqlite-vec` publishes a
# Linux binary. It runs on `ubuntu-latest` for that reason, and because macOS
# minutes bill at ten times the Linux rate on a private repository, which is the
# budget this pipeline actually spends. Moving the whole job back to one runner
# is the tidy-up that costs the most, so `tests/unit/workflows/ci.spec.ts` holds
# the split in place.
#
# The steps are the same commands a developer runs, in the same order, so any
# red run reproduces locally without translation:
#   pnpm typecheck · pnpm lint · pnpm lint:prose · pnpm first-launch:check · pnpm badges · pnpm test:electron-e2e
# and, for a job that has to package the app before it can run at all:
#   pnpm electron:pack · pnpm test:packaged-update-refused
#
# One step is not a command a developer runs: the fast job installs `lsof`,
# which the two socket tests in the unit suite drive and the Ubuntu image does
# not carry. Everything else is shared with a laptop on purpose.
#
# `pnpm badges` is `pnpm test` plus a JSON report, and the badge the README
# shows is drawn from that same run — which is what stops the test count being
# a number somebody has to remember to update.
#
# The link check is NOT here: it needs the network and a schedule, so it lives
# in `.github/workflows/doc-links.yml`.
#
# The lint step is ATR-054's flat config (`eslint.config.mjs`), which landed
# after the rest of this file did, and runs on the fast job: no build, no network,
# no native rebuild — the same command a developer runs.
name: CI

on:
  push:
  pull_request:
  # A dispatch runs every job in this file, the drill at the bottom included.
  # That is the point rather than an oversight: the drill's subject is the gate
  # the other jobs are running, and `gh workflow run ci.yml` is how a person
  # proves on a runner that the refusal check can still fail without waiting for
  # a push to do it for them.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck and the unit suite are host-ABI work: one install, no native
  # rebuild, and the fast signal — so they share a job and gate the slow ones.
  #
  # On Linux rather than on a Mac, which is a decision about cost and not about
  # the code: nothing here launches the app or packages it, and the three native
  # modules the suite loads all build or ship for Linux. The steps below are
  # unchanged, so a red run here still reproduces on a developer's machine —
  # a Mac or otherwise — with the same commands.
  check:
    name: typecheck + unit
    runs-on: ubuntu-latest
    # `contents: write` is for one step: the badge refresh below commits the SVG
    # when the counts moved. The rest of the job only reads. Worth knowing: a
    # push made with the default `GITHUB_TOKEN` does not start a new workflow
    # run, so the refresh cannot set this job off in a loop.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned `packageManager` field (pnpm 9.15.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # TypeScript says the program is coherent; this says the parts of it that
      # compile anyway are the parts somebody meant to write — an import nothing
      # uses, a `require` reached for out of habit, a type that accepts `0` where
      # the comment says "empty". See `eslint.config.mjs` for what it is not
      # (type-aware, stylistic) and why.
      #
      # A suppression that suppresses nothing is an error here as well, which is
      # what stops a disable comment from outliving the rule it was written for:
      # 27 of them did, naming rules that left with the Next-era linter, and
      # nothing noticed until they were read by hand.
      - run: pnpm lint
      # The prose, and the AI tells it must not carry. Python stdlib only, no
      # network, no build — the same shape as the checks above it, so it belongs
      # in the fast job.
      #
      # The checker is vendored at `scripts/check-prose-slop.py`, because the
      # skill it comes from is installed outside this repository and a runner has
      # no copy of it. Every rule comes from `.prose-guard.json` at the root: this
      # project decided there that em dashes are house style, so `no-em-dash` is
      # the skill's one rule at `warn` instead of its default `error` — 1,200-odd
      # of them are deliberate and none of them fails the build. A banned phrase,
      # AI vocabulary or a sycophantic opener is still an error, and the gate is
      # proved able to fail rather than only able to pass.
      #
      # `CHANGELOG.md` is scanned rather than skipped, deliberately: it is
      # outward prose this project writes and releases, so it was taken out of
      # the skill's default `skipPaths`.
      - name: The prose, and the AI tells it must not carry
        run: pnpm lint:prose
      # The first-launch instructions are rendered from one source
      # (`scripts/first-launch.mjs`) into the file inside the DMG, the release-note
      # paragraph and the CI warning. This fails if that file has drifted from what
      # renders it, and if any text a person can read still sends them through the
      # right-click override macOS 15 removed — which is the advice all three
      # surfaces carried, and the reason they are rendered from one place now.
      # Pure Node, no network, so it belongs in the fast job.
      - name: The first-launch instructions, and the advice they must not give
        run: pnpm first-launch:check
      # The front door must not name a release version. `README.md` said "The
      # current release is `v0.1.6`" for two releases after that stopped being
      # true, and the link check cannot see it: `.../alltherepos-releases/releases`
      # resolved the whole time, next to prose naming a superseded version. The
      # number belongs to the feed and the badge, which are read from it, and the
      # README links `.../releases/latest`, which redirects. Pure Node, no network.
      - name: The front door, and the versions it must not name
        run: pnpm versions:check
      # Every architecture in `electron-builder.yml` has to have a binary for
      # every native module inside the bundle, and "macOS on Apple silicon" is a
      # fact about that file while the reasons for it live in the dependency
      # tree — `better-sqlite3` and `find-git-repositories` compile from source
      # and cover anything, and `sqlite-vec` ships prebuilt binaries with
      # `darwin-x64` among them, which is why `x64` left the parked list: adding
      # it to the dmg/zip targets now packages a build that keeps semantic
      # search. This stays the gate that has to notice when that changes, because
      # a store that cannot load fails soft on purpose — `services/vector-store.ts`
      # reports the reason and search answers with keywords — so no other gate
      # would go red. It also prints which platforms *would* build, which is the
      # answer to "can we expand?". Pure Node, no network.
      - name: The architectures, and the binaries each one needs
        run: pnpm platforms:check
      # The only step here whose subject is this workflow. macOS minutes bill at
      # ten times the Linux rate on a private repository, so a job that moves to
      # a Mac is a spending decision rather than a style one — and the decision
      # lives in `scripts/check-ci-cost.mjs`, which fails when the workflows stop
      # agreeing with it: a new macOS job, a declared one that grew a second leg,
      # a runner label this repository has retired, or a job that lost the `if:`
      # keeping it off every push. Pure Node, no network, no YAML dependency —
      # the same shape as the checks around it.
      - name: What the pipeline may spend, and where it runs
        run: pnpm ci-cost:check
      # The unit suite drives the real `lsof` and `ps`: two end-to-end tests bind
      # a listening socket and expect the sweep to find it, so on a machine
      # without `lsof` they stop with a reason rather than running, and the
      # binding path would go untested on the only runner that still exercises it.
      # `ps` comes with the image and `lsof` does not, which is why this job
      # installs it instead of assuming it: these steps used to run on a Mac,
      # where it is already there.
      - name: lsof, for the two tests that drive a real listening socket
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lsof
      # The unit suite writes its own totals to a JSON report and the badge is
      # drawn from them, so the number in the README is always the number this
      # run just produced. It went stale by hand three times before this.
      - name: Unit suite, and the totals the badge is drawn from
        run: pnpm badges
      # Committed rather than checked, so the badge cannot be left stale by
      # forgetting to run anything. Only on main: a pull request's branch is not
      # what the README describes, and a fork cannot write anyway.
      - name: Commit the badge when the counts moved
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs/images/tests.svg; then
            echo "the badge already matches this run"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/tests.svg
          git commit -m "chore: refresh the test-count badge [skip ci]" \
            -m "Drawn from the unit suite that just ran, so it cannot drift from it."
          git push origin HEAD:main

  # Separate job on purpose: this one flips the native ABI to Electron's and
  # builds the bundle, which is exactly the state the check job must not be in
  # while it runs. It also fails for reasons the unit suite never sees.
  #
  # One leg, on the architecture the app ships. `electron-builder.yml` publishes
  # arm64 and nothing else, so the Intel leg built and launched a product nobody
  # can download — and it was the most expensive thing in this file: macOS
  # minutes bill at ten times the Linux rate on a private repository, and on the
  # Intel image `pnpm install` compiles both natives from source, which made that
  # leg 188s against this one's 61s. The question it was asked — *does this app
  # run on x86_64?* — is answered and on record (`docs/REMAINING-WORK.md`, with
  # the four priced options in `docs/FUTURE.md`): yes, and with the same tests
  # passing there as here. Intel stays unbuilt, so nothing is hidden by not
  # running the architecture nobody ships, and the leg is a second `include:`
  # entry away if that ever changes.
  #
  # The vector store is the piece with a soft failure in it: when the extension
  # will not load, `services/vector-store.ts` reports the reason and search
  # answers with keywords instead of throwing, so no gate goes red on its own.
  # Two gates cover that pair. `pnpm platforms:check` asserts from package
  # metadata that every declared architecture has a binary, on the fast job.
  # `tests/e2e/vector-store.spec.ts` measures the machine instead — it resolves
  # the extension, loads it through the same `better-sqlite3` the app uses, and
  # runs a real KNN query in a throwaway database, then requires a search with no
  # provider to say so out loud rather than quietly returning fewer kinds of
  # match. `tests/e2e/semantic-search.spec.ts` is the other side of the same
  # seam: it scans the seeded repos with a provider on the runner and asserts a
  # search comes back with a vector contribution, which is the only test where a
  # stored embedding and a query meet. The failure path itself — an extension
  # that will not load — cannot be arranged on a runner whose real machine is
  # what is under test, so it is covered where it can be:
  # `tests/unit/main/services/vector-store-unavailable.spec.ts`.
  #
  # The suite no longer depends on a scanned library: global setup seeds a
  # small synthetic catalog into a throwaway profile that every launch copies
  # (tests/e2e/_global-setup.ts), so specs exercise their populated branches
  # on a fresh runner too. Host-dependent legs (process detection) wait on
  # real `lsof` polling and are asserted, not tolerated.
  e2e:
    name: electron e2e
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The app ships one architecture, so the one leg has to be it. A runner
      # label is not evidence, and a job that quietly ran where the product is
      # not would look exactly like one that works — so ask the machine, and ask
      # the Electron binary the suite is about to launch, before it launches
      # anything.
      - name: Prove this is the architecture the app ships
        run: |
          set -euo pipefail
          echo "runner: $(uname -m) on macOS $(sw_vers -productVersion)"
          echo "node: $(node -p 'process.arch')"

          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::the app ships arm64, and this runner is $(uname -m)"
            exit 1
          fi

          ELECTRON="$(node -p 'require("electron")')"
          file "$ELECTRON"
          case "$(file -b "$ELECTRON")" in
            *arm64*) ;;
            *) echo "::error::the suite would launch $ELECTRON, which is not arm64"; exit 1 ;;
          esac
      - run: pnpm test:electron-e2e
      # One leg, so one name — and it is what a person looks for when this job
      # goes red. A second leg would have to name itself apart from this one.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  # The packaged update check, run against a GitHub that refuses to answer.
  #
  # When GitHub declines an anonymous read — 403, an allowance spent by somebody
  # else sharing the runner's address — the spec stops with a reason instead of
  # failing, because that status says nothing about the release. Right bargain,
  # one hole: **a skip is not a pass**, and the branch that skips is the branch
  # nothing exercises. The guard could stop guarding entirely and this pipeline
  # would look the same — green, with less and less behind the number.
  #
  # So the refusal is arranged instead of awaited. `scripts/refuse-github.cjs` is
  # required into the Playwright worker and answers every GitHub read with
  # GitHub's own 403, and `scripts/refused-update-check.mjs` fails this job unless
  # the tests that read the feed stopped *for that reason*, said so with a
  # `::warning::`, and nothing else in the suite failed. A run that skips for some
  # other reason, or that never reaches the mock at all, is a failure here —
  # which is the whole difference between covering a skip path and appearing to.
  #
  # Its own job rather than a step in `e2e`, for two reasons: it packages the app
  # rather than only building it, and it is the one job whose apparatus has to lie
  # about the network — a failure in it should not be read as one in the suite
  # next door. The two run in parallel, so what this costs is a runner, not time
  # on the clock.
  refusal:
    name: packaged update check, refused
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The spec launches real bundled apps, so there have to be two of them: the
      # current build, for the branch that asks whether the app is up to date,
      # and `electron:pack-older`'s — the same app stamped `0.0.1`, genuinely
      # below every release — for the branch that asks whether an update is
      # offered. A missing bundle is not a smaller run: the check below fails
      # unless every test that reads the feed stopped for the refusal, so skipping
      # either build fails the job rather than quietly reducing it.
      - run: pnpm electron:pack
      - run: pnpm electron:pack-older
      - name: The update check, against a GitHub that refuses to answer
        run: pnpm test:packaged-update-refused

  # The job above can stop noticing anything — the mock loaded, it refused
  # nothing, every test went green for its ordinary reasons, and the only thing
  # that changed is how much the gate is worth. Nothing about a passing run says
  # otherwise.
  #
  # So this proves the other half: the same command, the same spec, with the mock
  # deliberately thrown (`ATR_REFUSE_GITHUB=off`), and
  # `scripts/drill-refused-update-check.mjs` asserting the check comes back
  # *failed*, naming the refusal. A check that passed, or that failed because a
  # bundle was missing, is a failed drill.
  #
  # On demand only. It rebuilds the two bundles rather than reusing the job
  # above's, because a job gets a fresh runner: the alternative is uploading two
  # hundred megabytes of .app between jobs to save a minute of a run a person
  # asked for by hand.
  drill:
    name: prove the refusal check can fail
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The drilled command is the real one, so it needs what the real one needs.
      - run: pnpm electron:pack
      - run: pnpm electron:pack-older
      - name: The refusal check, against a mock that refuses nothing
        run: node scripts/drill-refused-update-check.mjs
