# Release — build the DMG + ZIP and publish them to the public releases repo.
#
# Triggered by pushing a `v*` tag, which is also the only way a release should
# happen: the tag names the version, and the guard below refuses to build if
# the tag and `package.json` disagree.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The artifacts do NOT land in this repo. They are published to the public
# releases-only repo named below — the same one `src/main/services/updater.ts`
# reads — so anyone who installs the app can check for updates without a
# credential, while the source stays private. `tests/unit/main/services/
# updater-feed.spec.ts` fails if this name, electron-builder's `publish` block
# and the updater's constants ever disagree.
#
# Publishing there needs a token that can write to *that* repo, which the
# workflow's own GITHUB_TOKEN cannot do — hence the RELEASES_TOKEN secret. See
# docs/RELEASING.md for how to mint it; the first step fails with instructions
# rather than letting electron-builder fail with a bare auth error.
#
# Publishing is deliberately two-phase: electron-builder uploads the assets to
# a DRAFT (EP_DRAFT=true), and the draft is published only once its notes are
# attached. `releases/latest` ignores drafts, so a half-published release is
# invisible to the updater instead of being offered as an empty one. It also
# makes the job re-runnable: electron-builder happily reuses an existing draft,
# while a release published more than two hours ago is silently left alone
# (see the 2-hour rule in docs/RELEASING.md).
name: Release

on:
  push:
    tags:
      - "v*"
  # The same job a tag push runs, rehearsed every week against `main`.
  #
  # A release pipeline is otherwise only ever exercised *by releasing*, so a break
  # in it — the tag/version guard, the notes step, electron-builder's config, the
  # publish block — is found at the worst possible moment: with a version already
  # tagged and pushed. This finds it on a quiet Monday instead. What it builds
  # cannot become visible; see the gate on the release job below, where only a tag
  # push can publish.
  schedule:
    # Mondays, 14:00 UTC — after the link check and the feed check of the same
    # morning, so a break they can see is reported before this spends a macOS
    # runner on it. GitHub disables a scheduled workflow after 60 days without
    # repository activity, and that is the one way this goes quietly idle.
    - cron: "0 14 * * 1"
  # On demand, for the two things that otherwise never run: `drill`, which proves
  # the draft cleanup against a real draft, and the release pipeline itself,
  # through the `rehearse` input below.
  #
  # The updater feed check used to be a job here. It has its own workflow now
  # (`.github/workflows/updater-feed.yml`), because it needs a clock more than it
  # needs this pipeline.
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Run the whole release pipeline into a scratch channel, publishing nothing"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # owner/repo, not a URL. The drift guard in tests/unit/main/services/
  # updater-feed.spec.ts compares this against the other two mentions.
  RELEASES_REPO: ivy00johns/alltherepos-releases

# One release at a time, and never cancel a half-uploaded one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ github.event_name == 'push' && 'build and publish' || 'rehearse into a scratch channel' }}
    # A tag push is the only thing that publishes. The two other ways in — a
    # dispatch with `rehearse`, and the weekly schedule — both build the same
    # artifacts under a scratch version and leave the release a **draft**, and a
    # draft is invisible to `releases/latest`, the only place an update check
    # looks.
    #
    # `github.event.inputs` rather than the `inputs` context on purpose: on a push
    # or on a schedule there are no inputs at all, and an absent value is exactly
    # what this needs to see.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.rehearse == 'true'
    runs-on: macos-14
    env:
      # Not-a-push means a rehearsal, and that direction is the deliberate one:
      # `--draft=false` is reachable only from the push branch of the step that
      # sets it, so a trigger added to this workflow later rehearses by accident
      # rather than publishing by accident.
      REHEARSE: ${{ github.event_name != 'push' }}
      # Valid semver, and deliberately *lower* than anything released. Even in
      # the failure this whole design exists to avoid — a scratch release
      # escaping into `releases/latest` — a 0.1.x install would read it as older
      # than itself and be offered nothing.
      #
      # No pre-release suffix, tempting as it is to have the version say what it
      # is. `electron-updater` reads a build whose own version carries a
      # pre-release tag as being on *that* pre-release's channel and goes looking
      # for releases tagged for it, so `0.0.0-rehearse.<run id>` found nothing and
      # reported "No published versions on GitHub". A plain `0.0.0` takes the same
      # path through the feed a real install takes, which is what the launch check
      # at the end of this job needs in order to assert anything at all.
      SCRATCH_VERSION: 0.0.0
    steps:
      - name: Check the publishing credential
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN is not set. Releases go to the public $RELEASES_REPO, which needs a token with 'contents: write' there — create one and add it as the repo secret RELEASES_TOKEN (docs/RELEASING.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Reads the pinned `packageManager` field (pnpm 9.15.0).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Everything below asks these five names instead of working them out, so a
      # rehearsal and a release differ in one place rather than in nine steps.
      #
      # A rehearsal has no tag to be named by — a dispatch runs on a branch — so
      # it builds under a scratch version and what it creates stays a draft. The
      # version the *changelog* is written for is still `package.json`'s, which
      # is what keeps the guard below honest: a rehearsal still fails on a
      # missing changelog section for the version being built.
      - name: Settle the version, the tag, and whether this publishes
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$REHEARSE" = "true" ]; then
            BUILD_VERSION="$SCRATCH_VERSION"
            TAG="v$SCRATCH_VERSION"
            GUARD_TAG="v$VERSION"
            DRAFT=true
          else
            BUILD_VERSION="$VERSION"
            TAG="$GITHUB_REF_NAME"
            GUARD_TAG="$GITHUB_REF_NAME"
            DRAFT=false
          fi
          {
            echo "VERSION=$VERSION"
            echo "BUILD_VERSION=$BUILD_VERSION"
            echo "TAG=$TAG"
            echo "GUARD_TAG=$GUARD_TAG"
            echo "DRAFT=$DRAFT"
          } >> "$GITHUB_ENV"
          echo "building $BUILD_VERSION, releasing as $TAG, guarding $GUARD_TAG, draft=$DRAFT"

      # Guard first, deliberately: a tag that disagrees with package.json, or a
      # version with no changelog section, fails here in seconds — before the
      # natives are rebuilt and before anything is uploaded. The notes land in
      # a file this job reuses at the end.
      #
      # `--silent` is load-bearing: without it pnpm writes its own `> script`
      # banner to stdout, that banner is what gets captured into the file, and
      # every published release then begins with a runner's absolute path
      # instead of a changelog.
      - name: Guard the tag and collect the release notes
        run: |
          pnpm --silent release:check "$GUARD_TAG" > "$RUNNER_TEMP/notes.md"
          echo "--- release notes ---"
          cat "$RUNNER_TEMP/notes.md"

      # Typecheck and the unit suite, because a tag can be pushed at a commit
      # that no PR ever carried. The Electron suite is deliberately not
      # repeated here: it is the push/PR gate, and it needs a GUI session, so
      # making it a release prerequisite would let a flaky window launch block
      # a DMG that is already correct.
      - run: pnpm typecheck
      - run: pnpm test

      - name: Rebuild natives for Electron and bundle the app
        run: |
          pnpm electron:rebuild
          pnpm electron:build

      # DMG for humans, ZIP for the updater (Squirrel.Mac cannot apply a DMG),
      # plus latest-mac.yml, which is generated from the ZIP target and is what
      # an update check reads. `publish always` is what lets this run outside a
      # local tag push, where electron-builder would otherwise decline.
      #
      # `-c.extraMetadata.version` is what makes a rehearsal possible at all:
      # electron-builder uploads to `v<version>`, so stamping the build with a
      # scratch version aims it at a scratch channel instead of at the tag a real
      # release would be using. On a tag push the value is the version
      # `package.json` already carries, so this is the same command as before.
      - name: Package and upload as a draft
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          EP_DRAFT: "true"
        run: pnpm exec electron-builder --mac --publish always -c.extraMetadata.version="$BUILD_VERSION"

      # Read the draft back before it can be seen. An upload that dropped the
      # ZIP, or wrote a manifest naming a version nobody built, fails the job
      # while the release is still invisible — the whole reason the draft comes
      # first. `--allow-draft` because a draft is expected at this point.
      - name: Verify the draft has all three assets
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: pnpm release:verify --allow-draft --tag "$TAG" --version "$BUILD_VERSION"

      # Publishing the draft is the last step, so the release appears complete:
      # assets up, notes on, then visible.
      #
      # The body leads with the DMG on purpose. GitHub orders the asset list by
      # its own rules and then appends two source archives of its own, so a
      # page whose first row is `…-mac.zip` reads as "this release is a zip" —
      # which is exactly how the first published release was misread. A named,
      # linked .dmg at the top removes the guesswork, and the paragraph under it
      # says what the other three assets are and why they exist.
      # A rehearsal runs this too, and stops one flag short: `--draft="$DRAFT"`
      # leaves its scratch release a draft, so the rehearsal covers the notes,
      # the DMG link and the checksum line exactly as a release does without any
      # of it becoming visible.
      - name: Attach the notes and publish the draft
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          DMG="AllTheRepos-${BUILD_VERSION}-arm64.dmg"
          {
            echo "## 📦 Download"
            echo
            echo "**[${DMG}](https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${DMG})** — the macOS installer (Apple silicon, $(du -h "release/${DMG}" | cut -f1))."
            echo
            echo "Open the DMG, drag **AllTheRepos** into Applications, then right-click the app →"
            echo "**Open** once. It is ad-hoc signed and **not notarised**, so the first launch has to"
            echo "go through that menu; after that it opens normally."
            echo
            echo "The other three assets are the update feed, not alternative installers: the app"
            echo "downloads the \`.zip\` because Squirrel.Mac cannot apply an update from a DMG, and"
            echo "it reads \`latest-mac.yml\` to decide whether an update exists at all. Updates in this"
            echo "build are **checks only** — with no Developer ID, the app cannot install them itself."
            echo
            echo "SHA-256: \`$(shasum -a 256 "release/${DMG}" | cut -d' ' -f1)\`"
            echo
            echo "---"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/release-body.md"
          gh release edit "$TAG" \
            --repo "$RELEASES_REPO" \
            --title "$TAG" \
            --draft="$DRAFT" \
            --notes-file "$RUNNER_TEMP/release-body.md"
          gh release view "$TAG" --repo "$RELEASES_REPO" \
            --json tagName,isDraft,assets \
            --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'

      # ... and once more in the state users actually see. The draft check ran
      # against a draft, where `releases/latest` does not apply; this is the
      # release an update check will resolve, so it is the one worth failing on.
      #
      # Not for a rehearsal: it published nothing, so `releases/latest` is still
      # the previous release and asserting on it would be asserting on somebody
      # else's work.
      - name: Verify the published release
        if: ${{ env.REHEARSE != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: pnpm release:verify --tag "$TAG"

      # The update check itself, end to end: the app this job just built, launched
      # as a real bundle, reading the live feed anonymously and reporting what it
      # finds there. Everything above verifies the *upload* — that the three
      # assets exist and that the manifest names what was attached — and none of
      # it runs the thing a person installs. "The feed is readable" and "the app
      # reads it" are not the same claim.
      #
      # A rehearsal is where this can run, and also where it says the most. The
      # build is stamped `0.0.0`, below every released `0.1.x`, so it is genuinely
      # behind the feed and has to offer the release that is live — a version that
      # appears nowhere in this build, and can therefore only have come from the
      # one request the check exists to make. On a tag push there is nothing to
      # assert: the app's own version *is* the feed's latest, so reading that back
      # would be racing the release GitHub has just been handed.
      #
      # The check is `tests/e2e/packaged-update-check.spec.ts`, the opt-in spec a
      # developer runs by hand, told which bundle to launch rather than given a
      # second copy of the assertion.
      - name: Launch the build and check for updates against the live feed
        if: ${{ env.REHEARSE == 'true' }}
        env:
          ATR_PACKAGED_UPDATE_BEHIND_BUNDLE: release/mac-arm64/AllTheRepos.app
        run: pnpm test:packaged-update

      # A run that dies between the upload and the publish leaves its assets on
      # a DRAFT — invisible to `releases/latest` and to `GET /releases/tags/{tag}`,
      # so nobody can see it — and the next run silently reuses it. That is
      # exactly the state the v0.1.1 release was found in, and it took a person
      # noticing a gap in the version list to find it.
      #
      # So clean up after ourselves instead of leaving it for that person. The
      # decisions live in `scripts/discard-draft-release.mjs` rather than here,
      # for one reason: this is the failure path, so it is the code nothing ever
      # runs. As a script it has unit tests for every branch, and the `drill` job
      # below proves it against a real draft in the releases repo on demand.
      - name: Discard the draft a failed run left behind
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: node scripts/discard-draft-release.mjs

      # A rehearsal leaves a scratch release that nothing else will ever remove:
      # the step above looks for the tag a real release would have been tagged
      # with, and a rehearsal's is not that tag. So take it away here, whether the
      # rehearsal passed or failed — a botched rehearsal should leave no more
      # trace than a clean one.
      - name: Delete the scratch release a rehearsal created
        if: ${{ always() && env.REHEARSE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            # No `--cleanup-tag`: a rehearsal's release is a draft, and a draft
            # has no tag of its own — GitHub files it under a placeholder like
            # `untagged-2da6…`, which is exactly what made the `drill` job below
            # fail with a 422 the first time it was dispatched.
            gh release delete "$TAG" --repo "$RELEASES_REPO" --yes
            echo "removed the scratch release $TAG"
          else
            echo "no scratch release $TAG to remove"
          fi
          # And the tag, if this is the other kind of draft and one exists.
          # Best effort on purpose: a draft normally has no ref at all, and a
          # dangling tag is a cosmetic annoyance in a repo nobody browses, while
          # a failed cleanup here would be a red run for no reason.
          gh api -X DELETE "repos/$RELEASES_REPO/git/refs/tags/$TAG" >/dev/null 2>&1 || true

  # The cleanup above is the failure path: it only ever runs after a release has
  # already gone wrong, which means it can sit for months without being
  # exercised — and a cleanup that silently does nothing looks exactly like one
  # that works, until a stale draft turns up. (That is how v0.1.1 was found.)
  #
  # So this job leaves a **real** draft in the releases repo, the way a run that
  # died mid-upload does, and runs the same script against it. It also proves the
  # half that matters more: that a **published** release is left alone. On demand
  # only — dispatch this workflow to run it.
  #
  # Its scratch releases are `--prerelease`, deliberately: `releases/latest`
  # skips pre-releases, so the app's update feed can never resolve to a drill.
  # Every scratch release it creates is deleted again in an `always()` step.
  # `--cleanup-tag` is correct *here* and wrong in the cleanup script, because
  # the tag lives in the releases repo — but only for the pre-release, which has
  # one: a `--draft` release is filed under a placeholder `untagged-…` name and
  # has no ref to clean up at all.
  drill:
    name: prove the draft cleanup
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    permissions:
      contents: read
    env:
      DRILL_DRAFT: drill-draft-${{ github.run_id }}
      DRILL_PUBLISHED: drill-published-${{ github.run_id }}
    steps:
      - name: Check the publishing credential
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::RELEASES_TOKEN is not set, so the drill has nothing to delete with."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Leave a real draft behind, the way a failed run does
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "$DRILL_DRAFT" --repo "$RELEASES_REPO" --draft \
            --title "$DRILL_DRAFT" \
            --notes "Scratch draft created by the release workflow's drill (run ${{ github.run_id }}). The same run deletes it again."
          echo "an asset, so the draft looks like an upload that stopped partway" > "$RUNNER_TEMP/scratch.txt"
          gh release upload "$DRILL_DRAFT" "$RUNNER_TEMP/scratch.txt" --repo "$RELEASES_REPO"
          gh release view "$DRILL_DRAFT" --repo "$RELEASES_REPO" --json isDraft,assets \
            --jq '"scratch draft: isDraft=\(.isDraft), assets=\(.assets|length)"'

      # The scratch tag goes in as a flag, not as an environment variable, and
      # that is not a style choice: `GITHUB_`-prefixed names are reserved, so a
      # step that sets `GITHUB_REF_NAME` is silently ignored — the log prints
      # the value while the process reads the real one (`main` on a dispatch),
      # and the cleanup then reports "no release tagged main" with the draft
      # still sitting there. That is how this drill failed on its first dispatch.
      - name: Run the cleanup against that real draft
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: node scripts/discard-draft-release.mjs --tag "$DRILL_DRAFT"

      - name: Assert the draft is gone
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if gh release view "$DRILL_DRAFT" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::the cleanup left $DRILL_DRAFT behind — the real failure path would leave a stale draft too."
            exit 1
          fi
          echo "::notice::the cleanup deleted the real draft"

      - name: Leave a published release behind for the cleanup to decline
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "$DRILL_PUBLISHED" --repo "$RELEASES_REPO" --prerelease \
            --title "$DRILL_PUBLISHED" \
            --notes "Scratch pre-release created by the release workflow's drill (run ${{ github.run_id }}). It proves the draft cleanup leaves a published release alone."
          gh release view "$DRILL_PUBLISHED" --repo "$RELEASES_REPO" --json isDraft,isPrerelease \
            --jq '"scratch release: isDraft=\(.isDraft), isPrerelease=\(.isPrerelease)"'

      - name: Run the cleanup against that published release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: node scripts/discard-draft-release.mjs --tag "$DRILL_PUBLISHED"

      - name: Assert the published release was left alone
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ! gh release view "$DRILL_PUBLISHED" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::the cleanup deleted a published release — which is the one thing it must never do."
            exit 1
          fi
          echo "::notice::the cleanup left the published release alone"

      - name: Delete the scratch releases the drill created
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          for tag in "$DRILL_DRAFT" "$DRILL_PUBLISHED"; do
            if gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
              # A release created with `--draft` has no tag of its own — GitHub
              # files it under a placeholder like `untagged-2da6…` — so
              # `--cleanup-tag` there asks it to delete a ref that was never
              # created, and comes back 422. Ask which release this is rather
              # than assuming: the `--prerelease` one does own a tag.
              if [ "$(gh release view "$tag" --repo "$RELEASES_REPO" --json isDraft --jq .isDraft)" = "true" ]; then
                gh release delete "$tag" --repo "$RELEASES_REPO" --yes
                echo "removed scratch draft $tag (a draft has no tag to clean up)"
              else
                gh release delete "$tag" --repo "$RELEASES_REPO" --yes --cleanup-tag
                echo "removed scratch release $tag, and the tag it created"
              fi
            fi
          done

